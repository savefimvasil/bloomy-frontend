name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Check out bloomy-frontend into bloomy-frontend/ so Dockerfile SERVICE paths match
      - uses: actions/checkout@v4
        with:
          path: bloomy-frontend

      # Shared Dockerfile lives in bloomy-deploy
      - name: Checkout bloomy-deploy
        run: git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/savefimvasil/bloomy-deploy.git bloomy-deploy

      # Dockerfile needs tily-packages at build time
      - name: Checkout tily-packages
        run: git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/savefimvasil/tily-packages.git tily-packages

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bloomy-deploy/Dockerfile.frontend
          build-args: |
            SERVICE=bloomy-frontend
            PORT=3001
            BUILD_GARDEN=true
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          push: true
          tags: ghcr.io/savefimvasil/bloomy-frontend:latest

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            git pull
            ./deploy.sh
